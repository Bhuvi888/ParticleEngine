<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="data:," />
    <title>Particle Morph — Vanilla Demo</title>
    <style>
      :root {
        color-scheme: dark;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
      }
      body {
        font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
        background: radial-gradient(
          120% 90% at 50% 0%,
          #1c2338 0%,
          #0b0e18 55%,
          #05060b 100%
        );
        color: #e8ecf8;
        overflow: hidden;
      }
      #stage {
        position: fixed;
        inset: 0;
      }
      #stage canvas {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      .badge {
        position: fixed;
        top: 20px;
        left: 24px;
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 12px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: rgba(232, 236, 248, 0.55);
        z-index: 10;
      }
      .badge .dot {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #f5c46b;
        box-shadow: 0 0 12px #f5c46b;
      }
      #stats {
        color: rgba(232, 236, 248, 0.32);
        text-transform: none;
        letter-spacing: 0.02em;
      }
      .hud {
        position: fixed;
        left: 50%;
        bottom: 26px;
        transform: translateX(-50%);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
        width: min(940px, calc(100% - 32px));
        z-index: 10;
      }
      .group {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        justify-content: center;
        gap: 6px;
        padding: 7px;
        border-radius: 999px;
        background: rgba(13, 17, 30, 0.66);
        border: 1px solid rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
      }
      .btn {
        appearance: none;
        border: 1px solid transparent;
        background: transparent;
        color: #cdd5ea;
        padding: 8px 15px;
        font-size: 13px;
        font-family: inherit;
        border-radius: 999px;
        cursor: pointer;
        letter-spacing: 0.01em;
        transition: background 0.18s, color 0.18s, border-color 0.18s;
      }
      .btn:hover {
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
      }
      .btn:focus-visible {
        outline: 2px solid #f5c46b;
        outline-offset: 2px;
      }
      .btn.active {
        background: #f6e7c8;
        border-color: #f6e7c8;
        color: #141720;
      }
      .btn.primary {
        border-color: rgba(245, 196, 107, 0.5);
        color: #f5c46b;
      }
      .btn.primary:hover {
        background: rgba(245, 196, 107, 0.14);
      }
      input[type="text"] {
        appearance: none;
        border: 1px solid rgba(255, 255, 255, 0.1);
        background: rgba(255, 255, 255, 0.05);
        color: #e8ecf8;
        font-family: inherit;
        font-size: 13px;
        padding: 8px 14px;
        border-radius: 999px;
        width: 160px;
        outline: none;
      }
      input[type="text"]:focus {
        border-color: rgba(245, 196, 107, 0.6);
      }
      label {
        display: flex;
        align-items: center;
        gap: 9px;
        font-size: 12px;
        color: rgba(232, 236, 248, 0.55);
        padding: 4px 12px 4px 16px;
      }
      input[type="range"] {
        accent-color: #f5c46b;
        width: 96px;
      }
      .hint {
        font-size: 12px;
        color: rgba(232, 236, 248, 0.38);
        letter-spacing: 0.02em;
      }
      @media (max-width: 660px) {
        .hud {
          bottom: 14px;
          gap: 8px;
        }
        .badge {
          top: 14px;
          left: 16px;
        }
        .hint {
          display: none;
        }
        input[type="text"] {
          width: 110px;
        }
      }
    </style>
  </head>
  <body>
    <div id="stage"><canvas id="canvas" aria-hidden="true"></canvas></div>

    <div class="badge">
      <span class="dot"></span>
      <span>Particle Morph</span>
      <span id="stats">&mdash;</span>
    </div>

    <div class="hud">
      <div class="group" id="formations" aria-label="Formations"></div>
      <div class="group">
        <input
          id="text-input"
          type="text"
          maxlength="14"
          placeholder="Type a word&hellip;"
          aria-label="Text formation input"
        />
        <button class="btn primary" id="text-btn">Form text</button>
        <button class="btn" id="theme-btn">Palette: Gold</button>
      </div>
      <div class="group">
        <label>Gravity <input id="gravity" type="range" min="0" max="24" step="1" value="8" /></label>
        <label>Turbulence <input id="turbulence" type="range" min="0" max="6" step="0.5" value="2" /></label>
      </div>
      <div class="hint">Move your cursor through the particles &mdash; they push away. Zero dependencies.</div>
    </div>

    <script src="../dist/particle-morph.global.js"></script>
    <script src="demo.js"></script>
  </body>
</html>
